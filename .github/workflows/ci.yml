name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (install + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (install + lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker-build:
    name: Docker image build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aegisops-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t aegisops-frontend:ci ./frontend

  # ---------------------------------------------------------------------------
  # DISABLED placeholder. Azure deployment is NOT configured and does NOT run
  # automatically. It is manual-only (workflow_dispatch) and guarded so it is a
  # no-op until real configuration is intentionally added in a later, approved
  # task. Contains placeholders only — no real Azure identifiers or secrets.
  # ---------------------------------------------------------------------------
  azure-deploy:
    name: Azure deploy (DISABLED placeholder)
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Guard
        run: |
          echo "Azure deployment is not configured. This job is a disabled placeholder."
          echo "Deployment will be implemented and enabled only in a later approved task (Milestone 9)."
          exit 1
